name: Bug report
description: Something in sbx-signing-agent, the kit or the README doesn't work as described.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **If the bug lets a sandbox get another key or agent, use the key for anything other than
        git signatures, or otherwise weakens isolation, don't report it here.** Use the repo's
        Security tab instead (see SECURITY.md).

        Don't paste private keys, tokens or full `ssh-add -L` output. Key fingerprints are fine.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sbx-signing-agent start
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Output of `sbx-signing-agent status` and any error messages.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: sbx
    attributes:
      label: sbx version
      description: Output of `sbx version`
    validations:
      required: true
  - type: input
    id: openssh
    attributes:
      label: OpenSSH version
      description: Output of `ssh -V`
    validations:
      required: true
